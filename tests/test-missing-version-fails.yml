name: Test package.json without version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pat: dummy-marketplace-pat-not-used-in-dry-run
          packagePath: tests/fixtures/ext-no-version
          dryRun: "true"
      - name: Assert action failed and produced no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "vsixPath: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for package.json without version"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: vsixPath should not be set"
            exit 1
          fi
          echo "PASS"
