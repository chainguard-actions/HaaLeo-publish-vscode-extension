name: Test baseContentUrl and baseImagesUrl rewrite README links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any stale vsix
        run: rm -f tests/fixtures/ext-links/*.vsix
      - id: action
        uses: .
        with:
          pat: dummy-marketplace-pat-not-used-in-dry-run
          packagePath: tests/fixtures/ext-links
          baseContentUrl: https://example.com/content
          baseImagesUrl: https://example.com/images
          dryRun: "true"
      - name: Assert vsix created and README links rewritten
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "tests/fixtures/ext-links/act-links-extension-2.0.0.vsix" ]; then
            echo "FAIL: unexpected vsixPath"
            exit 1
          fi
          if [ ! -s "$ACTUAL" ]; then
            echo "FAIL: vsix file not created"
            exit 1
          fi
          README="$(unzip -p "$ACTUAL" extension/README.md)"
          echo "packaged README:"
          echo "$README"
          if ! echo "$README" | grep -q "https://example.com/content/docs/guide.md"; then
            echo "FAIL: baseContentUrl not applied"
            exit 1
          fi
          if ! echo "$README" | grep -q "https://example.com/images/images/logo.png"; then
            echo "FAIL: baseImagesUrl not applied"
            exit 1
          fi
          echo "PASS"
