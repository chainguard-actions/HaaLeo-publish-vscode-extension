name: Test baseContentUrl and baseImagesUrl rewrite README links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any previous vsix
        run: rm -f tests/fixtures/readme-links-extension/*.vsix
      - id: action
        uses: .
        with:
          pat: dummy-pat-not-used-in-dry-run
          packagePath: tests/fixtures/readme-links-extension
          dryRun: 'true'
          dependencies: 'false'
          baseContentUrl: https://example.com/content
          baseImagesUrl: https://example.com/images
      - name: Assert vsixPath output
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "tests/fixtures/readme-links-extension/readme-links-ext-0.0.1.vsix" ]; then
            echo "FAIL: unexpected vsixPath"
            exit 1
          fi
          echo "PASS"
      - name: Assert README links were rewritten
        env:
          VSIX: ${{ steps.action.outputs.vsixPath }}
        run: |
          if [ ! -s "$VSIX" ]; then
            echo "FAIL: vsix file not created at $VSIX"
            exit 1
          fi
          python3 - "$VSIX" <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          readme = None
          for n in z.namelist():
              if n.lower() == 'extension/readme.md':
                  readme = z.read(n).decode('utf-8')
          if readme is None:
              print("FAIL: README.md not in vsix:", z.namelist())
              sys.exit(1)
          print(readme)
          if 'https://example.com/content' not in readme or 'guide.md' not in readme:
              print("FAIL: content link not rewritten with baseContentUrl")
              sys.exit(1)
          if 'https://example.com/images' not in readme or 'logo.png' not in readme:
              print("FAIL: image link not rewritten with baseImagesUrl")
              sys.exit(1)
          print("PASS")
          EOF
