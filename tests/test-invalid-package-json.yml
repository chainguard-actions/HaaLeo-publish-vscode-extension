name: Test invalid package.json fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pat: dummy-pat-not-used-in-dry-run
          packagePath: tests/fixtures/invalid-extension
          dryRun: 'true'
          dependencies: 'false'
      - name: Assert action failed without producing output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VSIX: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "vsixPath: $VSIX"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for package.json without version"
            exit 1
          fi
          if [ -n "$VSIX" ]; then
            echo "FAIL: vsixPath should not be set"
            exit 1
          fi
          if ls tests/fixtures/invalid-extension/*.vsix >/dev/null 2>&1; then
            echo "FAIL: a vsix was unexpectedly created"
            exit 1
          fi
          echo "PASS"
