name: Test missing pat fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          packagePath: tests/fixtures/sample-extension
          dryRun: 'true'
          dependencies: 'false'
      - name: Assert action failed on missing pat
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VSIX: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "vsixPath: $VSIX"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when required pat is missing"
            exit 1
          fi
          if [ -n "$VSIX" ]; then
            echo "FAIL: vsixPath should not be set"
            exit 1
          fi
          echo "PASS"
