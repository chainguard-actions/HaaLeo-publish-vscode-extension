name: Test dry run packages extension
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any stale vsix
        run: rm -f tests/fixtures/ext/*.vsix
      - id: action
        uses: .
        with:
          pat: dummy-marketplace-pat-not-used-in-dry-run
          packagePath: tests/fixtures/ext
          dryRun: "true"
      - name: Assert vsixPath output and file
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "tests/fixtures/ext/act-test-extension-1.2.3.vsix" ]; then
            echo "FAIL: unexpected vsixPath"
            exit 1
          fi
          if [ ! -s "$ACTUAL" ]; then
            echo "FAIL: vsix file not created at $ACTUAL"
            exit 1
          fi
          if ! unzip -l "$ACTUAL" | grep -q "extension/package.json"; then
            unzip -l "$ACTUAL" || true
            echo "FAIL: vsix does not contain extension/package.json"
            exit 1
          fi
          echo "PASS"
