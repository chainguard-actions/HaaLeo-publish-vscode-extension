name: Test extensionFile skips packaging
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a placeholder vsix
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt"
          echo "placeholder" > "$RUNNER_TEMP/prebuilt/prebuilt-0.0.1.vsix"
          echo "VSIX=$RUNNER_TEMP/prebuilt/prebuilt-0.0.1.vsix" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          pat: dummy-marketplace-pat-not-used-in-dry-run
          extensionFile: ${{ env.VSIX }}
          dryRun: "true"
      - name: Assert vsixPath equals provided extensionFile
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual: $ACTUAL"
          echo "expected: $VSIX"
          if [ "$ACTUAL" != "$VSIX" ]; then
            echo "FAIL: vsixPath should equal extensionFile"
            exit 1
          fi
          if [ "$(cat "$ACTUAL")" != "placeholder" ]; then
            echo "FAIL: provided file was modified"
            exit 1
          fi
          echo "PASS"
