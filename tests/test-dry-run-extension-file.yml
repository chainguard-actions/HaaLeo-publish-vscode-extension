name: Test dry-run with extensionFile input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake VSIX file for testing
        run: |
          mkdir -p /tmp/test-vsix
          echo "fake vsix content" > /tmp/test-vsix/test-extension-0.0.1.vsix

      - id: action
        uses: .
        with:
          pat: fake-pat-for-dry-run
          extensionFile: /tmp/test-vsix/test-extension-0.0.1.vsix
          dryRun: 'true'
          registryUrl: 'https://open-vsx.org'

      - name: Assert vsixPath output is set
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual vsixPath: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: vsixPath output is empty"
            exit 1
          fi
          echo "PASS: vsixPath is set to '$ACTUAL'"

      - name: Assert vsixPath points to the provided extensionFile
        env:
          ACTUAL: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "actual vsixPath: $ACTUAL"
          EXPECTED="/tmp/test-vsix/test-extension-0.0.1.vsix"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected vsixPath='$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: vsixPath matches the provided extensionFile"
