name: Test dry-run packaging
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pat: fake-pat-for-dry-run
          packagePath: ${{ github.workspace }}/tests/fixtures/minimal-extension
          dryRun: 'true'
          dependencies: 'false'
          noVerify: 'true'

      - name: Assert vsixPath output is set
        env:
          VSIX_PATH: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "vsixPath: $VSIX_PATH"
          if [ -z "$VSIX_PATH" ]; then
            echo "FAIL: vsixPath output is empty"
            exit 1
          fi
          echo "PASS: vsixPath is set to $VSIX_PATH"

      - name: Assert vsix file exists on disk
        env:
          VSIX_PATH: ${{ steps.action.outputs.vsixPath }}
        run: |
          echo "Checking for vsix file at: $VSIX_PATH"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "FAIL: vsix file does not exist at $VSIX_PATH"
            exit 1
          fi
          echo "PASS: vsix file exists"

      - name: Assert vsix filename matches expected pattern
        env:
          VSIX_PATH: ${{ steps.action.outputs.vsixPath }}
        run: |
          BASENAME=$(basename "$VSIX_PATH")
          echo "vsix filename: $BASENAME"
          if [[ "$BASENAME" != "test-extension-0.0.1.vsix" ]]; then
            echo "FAIL: expected filename 'test-extension-0.0.1.vsix', got '$BASENAME'"
            exit 1
          fi
          echo "PASS: vsix filename matches expected pattern"
